<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hallo Jen</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --border: #dde2ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14171c;
        --surface: #1e232b;
        --text: #e8ecf2;
        --muted: #9aa3b2;
        --border: #2d3440;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
    }

    main {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .cakes {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }

    p.night {
      margin: 0;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hallo Jen</h1>
    <div class="cakes" aria-hidden="true">🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂🎂</div>
    <p class="night">Gute Nacht</p>
  </main>
</body>
</html>
