<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hallo Jen</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --border: #dde2ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14171c;
        --surface: #1e232b;
        --text: #e8ecf2;
        --muted: #9aa3b2;
        --border: #2d3440;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px);
    }

    main {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    p.night {
      margin: 0;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      color: var(--muted);
    }

    .pie-scene {
      position: relative;
      width: fit-content;
      margin: 0 auto 1.5rem;
      padding-top: 2.2rem;
    }

    .pie {
      font-size: clamp(2.6rem, 8vw, 3.6rem);
      line-height: 1;
      display: block;
    }

    .steam {
      position: absolute;
      bottom: 68%;
      width: 6px;
      border-radius: 50%;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0));
      filter: blur(2px);
      opacity: 0;
      animation: rise 2.6s ease-in infinite;
    }

    @media (prefers-color-scheme: dark) {
      .steam {
        background: linear-gradient(to top, rgba(232, 236, 242, 0.5), rgba(232, 236, 242, 0));
      }
    }

    .steam:nth-child(1) { left: 32%; height: 34px; animation-delay: 0s; }
    .steam:nth-child(2) { left: 48%; height: 40px; animation-delay: 0.6s; }
    .steam:nth-child(3) { left: 64%; height: 32px; animation-delay: 1.2s; }

    @keyframes rise {
      0%   { transform: translateY(0) translateX(0) scaleY(0.8); opacity: 0; }
      15%  { opacity: 0.8; }
      50%  { transform: translateY(-16px) translateX(-4px) scaleY(1.1); opacity: 0.6; }
      100% { transform: translateY(-34px) translateX(6px) scaleY(1.3); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .steam { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hallo Jen</h1>
    <div class="pie-scene" aria-hidden="true">
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="steam"></span>
      <span class="pie">🥧</span>
    </div>
    <p class="night">Gute Nacht</p>
  </main>
</body>
</html>
